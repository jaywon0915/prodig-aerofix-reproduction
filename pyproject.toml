[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prodig-reimplementation"
version = "0.1.0"
description = "ProDiG (progressive aerial-to-ground Gaussian Splatting) reimplemented from the paper on gsplat"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "gsplat>=1.5.3,<2",
  "numpy>=1.24",
  "Pillow>=10",
  "pycolmap>=3.10",
  "scikit-learn>=1.3",
  "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
prodig-ply-train = "prodig.train:main"

[tool.setuptools.packages.find]
include = ["prodig*"]
